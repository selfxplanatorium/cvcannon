name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile pipeline scripts
        run: python -m py_compile scripts/cv.py scripts/privacy_check.py scripts/smoke_test.py
      - name: Run pipeline unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
      - name: Check public files for privacy risks
        run: python scripts/privacy_check.py

  docker-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker toolchain
        run: docker compose build
      - name: Exercise container commands
        run: |
          scripts/docker.sh make templates
          scripts/docker.sh make privacy
      - name: Run full pipeline smoke test
        run: scripts/docker.sh python3 scripts/smoke_test.py

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and the toolchain from a terminal without Python on PATH
        shell: cmd
        run: |
          rem C:\Windows holds the runner's py.exe, so leave it out to force the Python install.
          set "PATH=C:\Windows\System32"
          call cvcannon.cmd install
      - name: Report tools through the installed Python
        shell: cmd
        run: |
          rem C:\Windows holds the runner's py.exe, so leave it out to force the Python install.
          set "PATH=C:\Windows\System32"
          call cvcannon.cmd tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run pipeline unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
      - name: Check public files for privacy risks
        shell: cmd
        run: call cvcannon.cmd privacy
      - name: Run the pre-commit hook through Git for Windows
        shell: bash
        run: sh .githooks/pre-commit
      - name: Run full pipeline smoke test
        run: python scripts/smoke_test.py
