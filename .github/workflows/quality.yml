name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile pipeline scripts
        run: python -m py_compile scripts/cv.py scripts/privacy_check.py scripts/smoke_test.py
      - name: Run pipeline unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
      - name: Check public files for privacy risks
        run: python scripts/privacy_check.py

  docker-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker toolchain
        run: docker compose build
      - name: Exercise container commands
        run: |
          scripts/docker.sh make templates
          scripts/docker.sh make privacy
      - name: Run full pipeline smoke test
        run: scripts/docker.sh python3 scripts/smoke_test.py
